[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "change-to-your-name"
version = "0.1.0"
description = "Change to your description"
authors = [{ name = "Ash(GitHub@aashen1)" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "pydantic-settings>=2.14.1,<3",
    "structlog>=25.5.0,<26",
]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[tool.hatch.build.targets.wheel]
packages = ["src/change_to_your_name"]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C90",  # McCabe complexity
    "PL",   # Pylint (parameter/branch/statement limits, naming, etc.)
]
ignore = [
    "PLR2004", # Magic value used in comparison (allow tunable constants)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50
max-locals = 20
max-returns = 6
max-public-methods = 8

[tool.ruff.lint.isort]
known-first-party = ["change_to_your_name"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=change_to_your_name --cov-report=term-missing --cov-report=xml"

# ── coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/change_to_your_name"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
