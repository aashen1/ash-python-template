version: 2

updates:
  # Dependabot's pip ecosystem only scans pyproject.toml [project.dependencies].
  # Pixi dependencies are tracked by the "Update lock files" workflow instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(ci):"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
