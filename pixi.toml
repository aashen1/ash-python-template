[workspace]
authors = ["Ash(GitHub@aashen1)"]
channels = ["conda-forge"]
name = "change-to-your-name"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Code quality
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src/"
# Testing
test = "pytest"
# Security
security = "pip-audit"
# Documentation
docs = "mkdocs serve"
docs-build = "mkdocs build"
# Changelog
changelog = "towncrier build"

[dependencies]
python = "3.12.*"

# ── Dev feature: editable install + dev tools ─────────────────────────
[feature.dev.pypi-dependencies]
# Project itself (editable install so pytest can import source code)
change-to-your-name = { path = ".", editable = true }
# Code quality
ruff = "*"
mypy = "*"
# Testing
pytest = "*"
pytest-cov = "*"
pytest-mock = ">=3.15.1, <4"
responses = ">=0.26.1, <0.27"
# Security
pip-audit = "*"
# Git hooks
pre-commit = "*"
pre-commit-hooks = "*"
conventional-pre-commit = ">=4.4.0, <5"
# Documentation
mkdocs = "*"
mkdocs-material = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"
# Changelog
towncrier = "*"

# ── Prod feature: non-editable install + runtime deps (for Docker) ────
[feature.prod.pypi-dependencies]
# Project itself (non-editable install, pixi builds wheel and installs it)
change-to-your-name = { path = ".", editable = false }
# Runtime dependencies (must duplicate here since pixi.toml is the manifest,
# pixi does not auto-read [project.dependencies] from pyproject.toml)
pydantic-settings = ">=2.14.1, <3"
structlog = ">=25.5.0, <26"

# ── Environments ──────────────────────────────────────────────────────
[environments]
# Default: dev environment with project + all dev tools
# solve-group ensures default and prod use the same dependency versions
default = { features = ["dev"], solve-group = "prod-group" }
# Prod: Docker environment with project + runtime deps only
prod = { features = ["prod"], solve-group = "prod-group" }
