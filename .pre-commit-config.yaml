repos:
  - repo: local
    hooks:
      # Conventional Commits: enforce commit message format
      - id: conventional-pre-commit
        name: conventional commit message
        entry: conventional-pre-commit
        language: system
        stages: [commit-msg]
        args: []

      # Ruff: lint + format
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      # ty: static type checking
      - id: ty
        name: ty check
        entry: ty check
        language: system
        types: [python]

      # General code quality checks
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: check-toml
        language: system
        types: [toml]
      - id: check-json
        name: check json
        entry: check-json
        language: system
        types: [json]
      - id: check-merge-conflict
        name: check merge conflict
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private key
        entry: detect-private-key
        language: system
        types: [text]
      - id: check-added-large-files
        name: check added large files
        entry: check-added-large-files --maxkb=500
        language: system
        types: [text]
